# Tier 4 — the application itself. Starts last.
#
# `boot.autorestart` matters most here. Firecrawl's harness exits the whole
# container when a worker throws, so any unhandled worker fault is a full
# outage that nothing else recovers from. Its crash-to-exit time is ~38s
# (~1.5 restarts/min), comfortably under the 10-per-minute rate limit, so
# Incus will keep retrying rather than giving up — verified empirically.
#
# Applies to: firecrawl
config:
  boot.autostart.priority: "10"
  boot.autorestart: "true"
description: "Search_Providers: firecrawl API (starts last, restart on crash)"
devices: {}
