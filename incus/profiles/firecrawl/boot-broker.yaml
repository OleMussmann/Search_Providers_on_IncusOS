# Tier 2 — RabbitMQ.
#
# Split out from tier 1 for one reason: `boot.autostart.delay`. RabbitMQ needs
# ~12s+ before it accepts AMQP, and the delay is "seconds to wait after this
# instance starts before starting the NEXT one" — so it belongs on rabbitmq
# itself, holding the rest of the boot sequence back until the broker is
# actually listening.
#
# This is what prevents the 2026-09-14 outage: on that host reboot firecrawl
# started ~1 minute BEFORE rabbitmq, its nuq-workers threw an uncaught
# AggregateError on the initial AMQP connect, and the harness tore down the
# whole container.
#
# Applies to: rabbitmq
config:
  boot.autostart.priority: "90"
  boot.autostart.delay: "20"
  boot.autorestart: "true"
description: "Search_Providers: message broker (slow to accept AMQP; holds back the boot sequence)"
devices: {}
