# Tier 3 — services firecrawl calls at runtime rather than at startup.
#
# A missing playwright-service or searxng degrades a request; it does not kill
# the container the way a missing broker does. So they only need to be ordered
# ahead of firecrawl, not ahead of the stores.
#
# Applies to: playwright-service, searxng
config:
  boot.autostart.priority: "50"
  boot.autorestart: "true"
description: "Search_Providers: runtime-dependency services"
devices: {}
